<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 5 JS Final Project</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
    <script
      src="https://kit.fontawesome.com/025fb6f23f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <div class="landing__overlay"></div>
      <nav class="navbar">
        <div class="nav__row">
          <div class="nav__logo">
            <figure>
              <img src="./assets/OMdb_logo.svg" class="nav__logo--img" alt="" />
            </figure>
          </div>
          <ul class="nav__links">
            <a href="#" class="nav__link">Home</a>
            <a href="#" class="nav__link">Genres</a>
            <a href="#" class="nav__link">About</a>
            <a href="#" class="nav__link--primary">Contact</a>
          </ul>
        </div>
      </nav>
      <header>
        <div class="container">
          <div class="row">
            <div class="header__description">
              <h1 class="header__title">Find Your Favorite Film Today</h1>
              <div class="search__input--wrapper">
                <input
                  type="text"
                  class="search__input"
                  placeholder="Search by Name, Genre, or Year"
                />
                <i class="fa-solid fa-magnifying-glass search__logo"></i>
              </div>
            </div>
          </div>
        </div>
      </header>
    </section>
    <section id="search__results">
      <div class="filter__content--wrapper">
        <h1 class="search-info">Search Results:</h1>
        <div class="duration__filter--wrapper">
          <h2 class="filter-parameter">Film Length: 0 to 240 minutes</h2>
          <div
            data-v-66aecfa2=""
            role="slider"
            aria-valuemin="0"
            aria-valuemax="240"
            aria-orientation="horizontal"
            class="el-slider"
            aria-valuetext="0-240"
            aria-label="slider between 0 and 240"
          >
            <!---->
            <div class="el-slider__runway">
              <div class="el-slider__bar" style="width: 100%; left: 0%"></div>
              <div
                tabindex="0"
                class="el-slider__button-wrapper"
                style="left: 0%"
              >
                <div
                  class="el-tooltip el-slider__button"
                  aria-describedby="el-tooltip-2118"
                  tabindex="0"
                ></div>
              </div>
              <div
                tabindex="0"
                class="el-slider__button-wrapper"
                style="left: 100%"
              >
                <div
                  class="el-tooltip el-slider__button"
                  aria-describedby="el-tooltip-5588"
                  tabindex="0"
                ></div>
              </div>
              <div>
                <div
                  class="el-slider__stop el-slider__marks-stop"
                  style="left: 0%"
                ></div>
                <div
                  class="el-slider__stop el-slider__marks-stop"
                  style="left: 100%"
                ></div>
              </div>
              <div class="el-slider__marks">
                <div class="el-slider__marks-text" style="left: 0%">0 min</div>
                <div class="el-slider__marks-text" style="left: 100%">
                  240 min
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="movies">
        <div class="content__wrapper"></div>
      </div>
    </section>
  </body>
</html>
