<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 5 JS Final Project</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
    <script
      src="https://kit.fontawesome.com/025fb6f23f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <div class="landing__overlay"></div>
      <nav class="navbar">
        <div class="nav__row">
          <div class="nav__logo">
            <figure>
              <img src="./assets/OMdb_logo.svg" class="nav__logo--img" alt="" />
            </figure>
          </div>
          <ul class="nav__links">
            <a href="#" class="nav__link">Home</a>
            <a href="#" class="nav__link">Genres</a>
            <a href="#" class="nav__link">About</a>
            <a href="#" class="nav__link--primary">Contact</a>
          </ul>
        </div>
      </nav>
      <header>
        <div class="container">
          <div class="row">
            <div class="header__description">
              <h1 class="header__title">Find Your Favorite Film Today</h1>
              <div class="search__input--wrapper">
                <input
                  type="text"
                  class="search__input"
                  placeholder="Search by Name, Genre, or Year"
                />
                <i class="fa-solid fa-magnifying-glass search__logo"></i>
              </div>
            </div>
          </div>
        </div>
      </header>
    </section>
    <section id="search__results">
      <div class="filter__content--wrapper">
        <h1 class="search-info"></h1>
        <div class="duration-filter"></div>
      </div>
      <div id="movies">
        <div class="content__wrapper">
            
        </div>
      </div>
    </section>
  </body>
</html>
