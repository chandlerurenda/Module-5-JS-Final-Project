<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 5 JS Final Project</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js"></script>
    <script
      src="https://kit.fontawesome.com/025fb6f23f.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section id="landing">
      <div class="landing__overlay"></div>
      <nav class="navbar">
        <div class="nav__row">
          <div class="nav__logo">
            <figure>
              <img src="./assets/OMdb_logo.svg" class="nav__logo--img" alt="" />
            </figure>
          </div>
          <ul class="nav__links">
            <li><a href="#" class="nav__link">Home</a></li>
            <li><a href="#" class="nav__link">Genres</a></li>
            <li><a href="#" class="nav__link">About</a></li>
            <li><a href="#" class="nav__link--primary">Contact</a></li>
          </ul>
        </div>
      </nav>
      <header>
        <div class="container">
          <div class="row">
            <div class="header__description">
              <h1 class="header__title">Find Your Favorite Film Today</h1>
              <div class="search__input--wrapper">
                <input
                  type="text"
                  class="search__input"
                  placeholder="Search by Name, Genre, or Year"
                />
                <button class="submitBtn">
                <i class="fa-solid fa-magnifying-glass search__logo"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>
    </section>

    <section id="search__results">
      <div class="filter__content--wrapper">
        <h1 class="search-info">Search Results:</h1>
        <div class="duration__filter--wrapper">
          <h2 class="filter-parameter">Film Length: 0 to 240 minutes</h2>
          <input type="range" class="runtime__slider" min="0" max="240" />
          <div class="input__slider--text">
            <p>0 min</p>
            <p>240 min</p>
          </div>
        </div>
      </div>

      <div class="films">
        <div class="film">
          <figure class="film__img--wrapper">
            <img class="film__img" src="./assets/dune_film_img.jpg" alt="" />
          </figure>
          <div class="film__title">Dune</div>
          <div class="film__year">
            <img
              class="film__year--logo"
              src="./assets/calendar-days-solid-full.svg"
              alt=""
            />
            <div class="film__year--number">1984</div>
          </div>
          <div class="media__type--wrapper">
            <div class="media__type--logo">
              <img src="./assets/clapperboard-solid-full.svg" alt="" />
            </div>
              <div class="media__type"></div>
          </div>
          <div class="film__rating--wrapper">
            <div class="film__rating--logo">
              <img src="./assets/star-solid-full.svg" alt="" />
            </div>
            <div class="film__rating--number">6.2/10</div>
            <!-- Closing tag fixed here -->
          </div>
          <div class="film__duration">
            <div class="film__duration--logo">
              <img src="./assets/clock-regular-full.svg" alt="" />
            </div>
            <div class="film__duration--number">2h 17m</div>
          </div>
        </div>
        <!-- Repeat for other films -->
      </div>
    </section>

    <footer class="footer">
      <!-- Footer content goes here -->
    </footer>
  </body>
</html>
